KERNEL_DEVICETREE = "aspeed/aspeed-ast2600-evb.dtb"

UBOOT_MACHINE = "ast2600_openbmc_defconfig"
UBOOT_DEVICETREE = "ast2600-evb"
SPL_BINARY = "spl/u-boot-spl.bin"

# ast2600.inc defaults this to 1; signing without an OTP config fails the u-boot build.
SOCSEC_SIGN_ENABLE = "0"

KMACHINE = "aspeed"

# DevKit is an AST2600 EVB derivative: this satisfies COMPATIBLE_MACHINE on the
# aspeed SDK u-boot recipes and inherits their evb-ast2600-scoped patches and
# fw_env.config. ami-devkit still wins on conflicts as the rightmost override.
MACHINEOVERRIDES =. "evb-ast2600:"

require conf/machine/include/obmc-evb-common.inc
require conf/machine/include/ast2600.inc

MACHINE_FEATURES += " \
    obmc-host-ipmi \
    obmc-phosphor-fan-mgmt \
    obmc-phosphor-chassis-mgmt \
    obmc-phosphor-flash-mgmt \
    obmc-host-state-mgmt \
    obmc-chassis-state-mgmt \
    obmc-bmc-state-mgmt \
"

PREFERRED_PROVIDER_virtual/bootloader = "u-boot-aspeed-sdk"
PREFERRED_PROVIDER_u-boot = "u-boot-aspeed-sdk"
PREFERRED_PROVIDER_u-boot-fw-utils = "u-boot-fw-utils-aspeed-sdk"
PREFERRED_PROVIDER_virtual/kernel = "linux-onetree"
PREFERRED_PROVIDER_virtual/obmc-host-ipmi-hw = "phosphor-ipmi-kcs"
PREFERRED_PROVIDER_virtual/obmc-chassis-mgmt = "packagegroup-ami-devkit"
PREFERRED_PROVIDER_virtual/obmc-fan-mgmt = "packagegroup-ami-devkit"
PREFERRED_PROVIDER_virtual/obmc-flash-mgmt = "packagegroup-ami-devkit"
PREFERRED_PROVIDER_virtual/obmc-system-mgmt = "packagegroup-ami-devkit"

VIRTUAL-RUNTIME_obmc-host-state-manager = "x86-power-control"
VIRTUAL-RUNTIME_obmc-chassis-state-manager = "x86-power-control"
VIRTUAL-RUNTIME_obmc-discover-system-state = "x86-power-control"

SERIAL_CONSOLES = "115200;ttyS4"