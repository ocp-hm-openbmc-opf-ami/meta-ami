# Mode: either bus-owner or endpoint or unknown
mode = "bus-owner"

# MCTP protocol configuration. Used for both endpoint and bus-owner modes.
[mctp]
message_timeout_ms = 30

# Specify a UUID: not generally required - mctpd will query the system UUID
# where available.
# uuid = "21f0f554-7f7c-4211-9ca1-6d0f000ea9e7"

# bus-owner configuration
[bus-owner]

# dynamic EID range: a 2-element array of min and max (inclusive) EID values.
dynamic_eid_range = [8, 254]

max_pool_size = 15

# Bus Owner/bridge polling interval (ms) to check endpoint accessibility.
# A value of 0 disables polling.
endpoint_poll_ms = 0

# ============================================================================
# Discovery Configuration
# ============================================================================

# I2C Discovery configuration
[mctp_i2c]
# Network number for I2C MCTP devices
mctp_i2c_net = 1
# Enable ARP mode
mctp_i2c_arp_mode = false
# Whitelist of I2C addresses to probe (hex, space-separated)
mctp_i2c_whitelist = "12 13 1d 32"
# Poll interval in seconds
mctp_i2c_poll_interval_secs = 30

# I3C Discovery configuration
[mctp_i3c]
# Network number for I3C MCTP devices
mctp_i3c_net = 8
# Platform ID (2600 or 2700)
mctp_i3c_platform = "aspeed-2600"
# Poll interval in seconds
mctp_i3c_poll_interval_secs = 120

[[i3c.devices]]
name = "cpu1"
bus_num = 2
pid_mask = 0x0F
role = "bus-owner"
is_i3c_target = true
static_eid = 0

[[i3c.devices]]
name = "pfr"
bus_num = 0
device_pid = 0x020a0000000b
role = "endpoint"
is_i3c_target = false
static_eid = 23

# PCIe Discovery configuration
[mctp_pcie]
# Network number for PCIe MCTP devices
mctp_pcie_net = 3
# PCIe role: "bus-owner" or empty
mctp_pcie_role = "endpoint"
# Poll interval in seconds
mctp_pcie_poll_interval_secs = 60

# USB Discovery configuration
[mctp_usb]
# Network number for USB MCTP devices
mctp_usb_net = 5
# Poll interval in seconds
mctp_usb_poll_interval_secs = 60
# Enable USB hotplug device arrival/departure detection
mctp_usb_hotplug_enabled = false

