# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ast2700-sdk-layer"
BBFILE_PATTERN_ast2700-sdk-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_ast2700-sdk-layer = "11"
LAYERSERIES_COMPAT_ast2700-sdk-layer = "nanbield  scarthgap"
MULTI_SOL_ENABLED = "${@bb.utils.contains('MACHINE', 'ast2700-dcscm','0','1',d)}"

BAD_RECOMMENDATIONS:remove =" udev-hwdb shared-mime-info e2fsprogs-e2fsck"
