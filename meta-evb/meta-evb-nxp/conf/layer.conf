# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "nxp-layer"
BBFILE_PATTERN_nxp-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_nxp-layer = "6"

LAYERVERSION_nxp-layer = "1"
LAYERSERIES_COMPAT_nxp-layer = "walnascar"

# Disable OP-TEE and SMW recipes from this layer
#BBMASK:append = " ${LAYERDIR}/meta-common/meta-imx-bsp/recipes-security/optee/ "
#BBMASK:append = " ${LAYERDIR}/meta-common/meta-imx-bsp/recipes-security/smw/ "

# Disable OCC (not used on i.MX9x)
BBMASK:append = " ${LAYERDIR}/meta-imx91/recipes-phosphor/occ/ "
BBMASK:append = " ${LAYERDIR}/meta-imx93/recipes-phosphor/occ/ "
BBMASK:append = " ${LAYERDIR}/meta-imx943/recipes-phosphor/occ/ "
BBMASK:append = " ${LAYERDIR}/meta-imx95/recipes-phosphor/occ/ "

# Mask bbappends that have no matching base recipes for i.MX9x OpenBMC
BBMASK:append = " ${LAYERDIR}/recipes-bsp/skiboot/ "
#BBMASK:append = " ${LAYERDIR}/meta-common/meta-imx-bsp/recipes-graphics/vulkan/ "
BBMASK:append = " recipes-graphics/vulkan/vulkan-loader_1.4.309.0.bbappend "

# Disable NXP manufacturing tool (mfgtool / UUU)
IMAGE_CLASSES:remove = "image_populate_mfgtool"

# ---------------------------------------------------------------------------
# AMI_CORE_FEATURES overrides for NXP platforms
#
# meta-ami/conf/layer.conf appends a large set of AMI_CORE_FEATURES to
# EXTRA_IMAGE_FEATURES. Several of those features require recipes that only
# exist in ASPEED-, Intel-, or meta-core-specific layers which are not part
# of any NXP build. Remove them here so all NXP machines build cleanly.
#
#   onetree-fru          -> default-fru         (meta-ami/meta-evb-aspeed only)
#   onetree-2fa          -> google-authenticator-libpam (meta-security only,
#                           not in NXP BBLAYERS)
#   onetree-host-error   -> host-error-monitor  (meta-intel-openbmc only)
#   onetree-media-redirect -> virtual-media     (meta-core/meta-common only)
#   onetree-prov-mode-mgr -> prov-mode-mgr      (meta-core/meta-common only)
#   onetree-tools        -> i3c-tools, dbus-tools (meta-core/meta-evb-aspeed only)
# ---------------------------------------------------------------------------
AMI_CORE_FEATURES:remove = " \
    onetree-fru \
    onetree-2fa \
    onetree-host-error \
    onetree-media-redirect \
    onetree-prov-mode-mgr \
    onetree-tools \
    "

# system-watchdog recipe lives in meta-core which is not in the NXP layer stack.
# meta-ami/conf/layer.conf adds it to IMAGE_INSTALL for all non-intel-pfr builds.
IMAGE_INSTALL:remove = "system-watchdog"
IMAGE_INSTALL:remove = "hw-watchdog"

# emmc-enable is ASPEED/Intel specific, not needed on NXP platforms.
IMAGE_INSTALL:remove = "emmc-enable"

# intel-ipmi-oem-ext is Intel specific, not needed on NXP platforms.
# Build-time dependency is removed via phosphor-sel-logger_%.bbappend.
IMAGE_INSTALL:remove = "intel-ipmi-oem-ext"
SKIP_RECIPE[intel-ipmi-oem-ext] = "Intel specific, not needed for NXP platforms"
