#@TYPE: Machine
#@NAME: imx95 Development Board (64bit)
#@DESCRIPTION: Machine configuration for the imx95 in 64 bits mode

DEFAULTTUNE = "cortexa55"

include conf/machine/include/imx95.inc

RPI_KERNEL_DEVICETREE = " \
    freescale/${KERNEL_DEVICETREE} \
"

SDIMG_KERNELIMAGE ?= "kernel8.img"

SERIAL_CONSOLES ?= "115200;ttyLP0"
SYSTEMD_AUTO_ENABLE = "enable"

WKS_FILE = "obmc-phosphor-image.evb-${KSOC}.wks"

ATF_PLATFORM = "${KSOC}"

UBOOT_CONFIG_BASENAME = "${CONFIG_BASENAME}"
#UBOOT_DTB_NAME = "imx95-15x15-frdm-bmc.dtb"
UBOOT_DTB_NAME = "imx95-19x19-evk-ep-adv7535.dtb"
IMAGE_BOOT_FILES = "u-boot.bin Image ${@' '.join([dtb.split('/')[-1] for dtb in d.getVar('KERNEL_DEVICETREE').split()])}"
#IMAGE_BOOT_FILES:append = " imx95-15x15-frdm-bmc.dtb"
IMAGE_BOOT_FILES:append = " imx95-19x19-evk-ep-adv7535.dtb"
BOOTIMG_DIR = "${DEPLOY_DIR_IMAGE}"

# Accept NXP firmware EULA (needed to fetch ELE/DDR blobs)
ACCEPT_FSL_EULA = "1"

# Make imx-boot depend on the ELE firmware recipe
IMX_EXTRA_FIRMWARE = "firmware-ele-imx"
SECO_FIRMWARE_NAME = "mx95b0-ahab-container.img"

PREFERRED_PROVIDER_virtual/bootloader = "u-boot-imx"

# In each NXP machine conf
MACHINEOVERRIDES =. "nxp:"

# Treat evb-imx95 like an mx9-generic-bsp for recipe overrides/compatibility:
MACHINEOVERRIDES:append = ":mx9-generic-bsp:mx95-generic-bsp:mx95-nxp-bsp:imx-nxp-bsp"
SYSTEM_MANAGER_CONFIG = "mx95evk"

# "zImage" not supported on arm64 and ".gz" images not supported by bootloader yet
KERNEL_IMAGETYPE = "Image"
KERNEL_IMAGETYPE_DIRECT = "Image"
KERNEL_BOOTCMD ?= "booti"

ARMSTUB ?= "armstub8-gic.bin"

VIRTUAL-RUNTIME_obmc-gpio-monitor = "obmc-gpio-monitor"

PREFERRED_PROVIDER_virtual/phosphor-led-manager-config-native = "imx-led-manager-config-native"
PREFERRED_PROVIDER_virtual/openpower-occ-control-config-native = "imx-occ-control-config-native"


# Disable SOF (Sound Open Firmware) - not needed for IMX95
MACHINE_FEATURES:remove = "alsa"
# Override MACHINE_FIRMWARE for mx95 - remove unavailable packages for BMC
MACHINE_FIRMWARE:remove:mx95-nxp-bsp = "sof-zephyr firmware-imx-xcvr-imx95"

# imx-base-extend.inc prefers 2.4.123.imx which has no recipe in this layer
# stack. Use the version provided by poky instead.
PREFERRED_VERSION_libdrm:imx-nxp-bsp = "2.4.124"

#Ensure imx-boot is built before creating WIC image
WKS_FILE_DEPENDS += "imx-boot"

# AMI write_flash_size_to_file postprocess requires FLASH_SIZE (in KB).
# NXP uses eMMC; 64 MB matches MBOXD_FLASH_SIZE for this machine.
FLASH_SIZE = "65536"
