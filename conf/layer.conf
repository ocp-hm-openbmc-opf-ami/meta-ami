DEFAULT_IMAGE_LINGUAS = ""

#verified boot
#SPL_BINARY = "spl/u-boot-spl.bin"
UBOOT_SIGN_ENABLE = "0"
SPL_SIGN_ENABLE = "0"
UBOOT_FITIMAGE_ENABLE = "0"

FIT_HASH_ALG = "sha256"
FIT_SIGN_ALG = "rsa2048"
FIT_SIGN_NUMBITS = "2048"
UBOOT_FIT_HASH_ALG = "sha256"
UBOOT_FIT_SIGN_ALG = "rsa2048"
UBOOT_FIT_SIGN_NUMBITS = "2048"

UBOOT_SIGN_KEYNAME = "rsa_oem_fitimage_key"
SPL_SIGN_KEYNAME = "rsa_oem_fitimage_key"

UBOOT_SIGN_KEYDIR = "${WORKDIR}"
SPL_SIGN_KEYDIR = "${WORKDIR}"
#verified boot

#Enable Caliptra Secure Boot on AST2700 A1
#OTP_IMAGE_ENABLE = "1"
#OTPTOOL_CONFIGS = "${STAGING_DATADIR_NATIVE}/aspeed-secure-config/ast2700/otp/2700A1_ECDSA384.json"
#OTPTOOL_KEY_DIR = "${STAGING_DATADIR_NATIVE}/aspeed-secure-config/ast2700/keys"
#OTPTOOL_EXTRA_OPTS = "--no_last_bit"
#OTPTOOL_SOC = "2700"
#FMC_IMAGE_ENABLE = "1"
#FMC_SIGN_ENABLE = "1"
#FMC_ECC_KEY_INDEX = "0"
#FMC_ECC_KEY = "${STAGING_DATADIR_NATIVE}/aspeed-secure-config/ast2700/keys/test_oem_dss_private_key_ecdsa384_0.pem"

#OEM Privilege
FEATURE_OEM_PRIV = "1"

#SNMP Trap V3
FEATURE_SNMP_TRAPV3 = "1"

#OpenSSL FIPD
OPENSSL_FIPS_SUPPORT = "enabled"

#NCSI Polling Interval
NCSI_POLLING_INTERVAL = "5"

#USB Port B Function Settings (Default as HOST Controller with Mass Storage, USB Net Adapter(ECM and NCM) and HID Support)
#Note: The HOST Controller and Gadget Device are mutually exclusive, meaning only one function can be active at a time.
#USB_Port_B_Function = "Gadget-Device"

#Enable IPMI BT DRIVER
#IPMI_BT_SUPPORT = "ipmi-bt-enable"

