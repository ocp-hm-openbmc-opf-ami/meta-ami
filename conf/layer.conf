# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*/*/*.bbappend \
            ${LAYERDIR}/meta-common/recipes-*/*/*.bb \
            ${LAYERDIR}/meta-common/recipes-*/*/*.bbappend \
           "

BBFILE_COLLECTIONS += "meta-ami"
BBFILE_PATTERN_meta-ami = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-ami = "14"

LAYERVERSION_meta-ami = "1"
LAYERSERIES_COMPAT_meta-ami = "walnascar"

AMIBASE = '${@os.path.normpath("${LAYERDIR}/")}'

IMAGE_INSTALL:append = " systemd-analyze "

IMAGE_INSTALL:append = " ${@bb.utils.contains('IMAGE_FEATURES', 'onetree-rtp', 'redfish-rde-dbus', '', d)}"
IMAGE_INSTALL:append = " ${@bb.utils.contains('IMAGE_FSTYPES', 'intel-pfr', '', 'ami-fw-update', d)}"
# TODO: Need to be enabled from package-group 
IMAGE_INSTALL:append = " phosphor-gpio-monitor"
IMAGE_INSTALL:remove = " ${@bb.utils.contains('IMAGE_FSTYPES', 'intel-pfr', '', 'intel-fw-update', d)}"
IMAGE_INSTALL:append:intel-ast2600 = " ${@bb.utils.contains('IMAGE_FSTYPES', 'intel-pfr', '', ' zram ', d)}"
DISTRO_FEATURES:append = " ldap slp"
IMAGE_FEATURES += "obmc-user-mgmt-ldap"

BBMASK += " ${@bb.utils.contains('MACHINE', 'intel-ast2600','','/meta-core/meta-common/recipes-phosphor/fru/default-fru* ../meta-ami/meta-common/recipes-phosphor/fru/default-fru*', d)}"
BBMASK += " ${@bb.utils.contains('IMAGE_FEATURES', 'onetree-fwupdate', '','recipes-phosphor/flash/cpld-tool.bbappend', d)}"
BBMASK += "meta-openembedded/meta-oe/recipes-extended/ostree/ostree_2024.10.bb"

PRODUCT_GENERATION_TAG = "OneTree"

IMAGE_FEATURES[validitems] += " \
cpld-update \
bios-update \
dual-image \
image-sign  \
sync-conf \
hw-failsafe-boot  \
single-spi-abr  \
"
NON_PFR_UPDATE_FEATURES = ""
#NON_PFR_UPDATE_FEATURES:append = " cpld-update"
NON_PFR_UPDATE_FEATURES:append = " bios-update"
#NON_PFR_UPDATE_FEATURES:append = " dual-image"
#NON_PFR_UPDATE_FEATURES:append = " image-sign"

# NON_PFR_DUAL_FEATURES= " sync-conf"
# NON_PFR_DUAL_FEATURES:append = " hw-failsafe-boot"
# NON_PFR_DUAL_FEATURES= " single-spi-abr"

# EXTRA_IMAGE_FEATURES:append = " ${@bb.utils.contains('IMAGE_FSTYPES', 'intel-pfr', '', NON_PFR_UPDATE_FEATURES , d)}"
# EXTRA_IMAGE_FEATURES:append = " ${@bb.utils.contains('NON_PFR_UPDATE_FEATURES', 'dual-image', NON_PFR_DUAL_FEATURES, '' , d)}"

IMAGE_INSTALL:append = "${@bb.utils.contains('IMAGE_FEATURES', 'onetree-fwupdate', ' cpld-tool ','', d)}"
IMAGE_INSTALL:append = "${@bb.utils.contains('IMAGE_FSTYPES', 'intel-pfr', '', ' system-watchdog ' , d)}"
IMAGE_INSTALL:append = "${@bb.utils.contains('IMAGE_FEATURES', 'onetree-dual-image', ' u-boot-tools ','', d)}"
IMAGE_INSTALL:append = "${@bb.utils.contains('BBFILE_COLLECTIONS', 'intel-features', ' nv-sync ', ' ami-sync ', d)}"

